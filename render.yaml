services:
  # Единый сервис: Node.js API + статический фронтенд (same-origin)
  - type: web
    name: speeddash-pro
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm install
    startCommand: npm run web
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_BASE_URL
        value: https://speeddash-pro.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://speeddash-pro.onrender.com
